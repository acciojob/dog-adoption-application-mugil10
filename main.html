<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dog Adoption Application</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="form-container">
    <h1>🐾 Dog Adoption Application</h1>
    <p class="subtitle">Fill out the form below to apply for adoption</p>

    <form action="#" method="post">

      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Name">
      </div>

      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="text" id="phone" placeholder="Phone Number">
      </div>

      <div class="form-group">
        <label for="address">Address</label>
        <input type="text" id="address" placeholder="Address">
      </div>

      <div class="form-group checkbox-group">
        <input type="checkbox" id="checkbox" value="Have you ever lived with a Dog before?">
        <label for="checkbox">Have you ever lived with a Dog before?</label>
      </div>

      <div class="form-group">
        <label for="multiSelect">Please select your preferred breeds</label>
        <select id="multiSelect" multiple>
          <option value="labrador">Labrador Retriever</option>
          <option value="beagle">Beagle</option>
          <option value="golden">Golden Retriever</option>
          <option value="pug">Pug</option>
          <option value="german_shepherd">German Shepherd</option>
        </select>
      </div>

      <div class="form-group">
        <input type="submit" id="submit" value="Submit">
      </div>

    </form>
  </div>

</body>
</html>
